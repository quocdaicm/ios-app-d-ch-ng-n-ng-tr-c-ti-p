name: Build IPA
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: |
          unzip -q LiveTranslate.zip
          cd LiveTranslate
          brew install xcodegen
          xcodegen generate
          xcodebuild -project LiveTranslate.xcodeproj -scheme LiveTranslate -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/LiveTranslate.app Payload/
          zip -qr ../LiveTranslate.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: LiveTranslate-ipa
          path: LiveTranslate.ipa
